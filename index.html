<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>FootballFitStore</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--card:#151518;--card2:#1c1c21;--line:#2a2a31;--txt:#f4f4f6;--mut:#9a9aa6;--acc:#2aabee;--grn:#2bd97c;--gry:#8c8c99}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif}
body{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:40px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:var(--txt)}
.top{position:sticky;top:0;z-index:20;background:rgba(11,11,13,.92);backdrop-filter:blur(12px);padding:12px 16px 10px;border-bottom:1px solid #18181c}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #2a2a31}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.3px}
.brand span{font-size:12px;color:var(--mut);display:block;font-weight:500}
.back{width:34px;height:34px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:18px}
.search{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.search input{flex:1;background:none;border:0;outline:0;font-size:15px}
.search input::placeholder{color:#6d6d78}
.wrap{padding:16px}
.demo{background:#2a2410;border:1px solid #5a4b10;color:#ffe680;font-size:12.5px;border-radius:12px;padding:9px 12px;margin-bottom:14px;line-height:1.4}
.hero{position:relative;border-radius:22px;overflow:hidden;height:170px;margin-bottom:18px}
.hero img{width:100%;height:100%;object-fit:cover;filter:brightness(.55)}
.hero div{position:absolute;left:18px;bottom:16px;right:18px}
.hero h1{font-size:30px;font-weight:900;letter-spacing:-1px;line-height:1}
.hero p{color:#ddd;font-size:13.5px;margin-top:6px;font-weight:500}
h2{font-size:19px;font-weight:800;letter-spacing:-.4px;margin:6px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-size:13px;color:var(--mut);font-weight:600}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.cat{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/3;background:var(--card);text-align:left}
.cat.wide{grid-column:span 2;aspect-ratio:16/7}
.cat img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.cat:active img{transform:scale(1.04)}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.85))}
.cat span{position:absolute;left:14px;bottom:12px;z-index:2;font-weight:900;font-size:19px;letter-spacing:-.4px}
.cat em{position:absolute;right:12px;top:10px;z-index:2;background:rgba(0,0,0,.55);font-style:normal;font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:var(--card);border:1px solid #1d1d22;border-radius:18px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:1;background:radial-gradient(circle at 50% 55%,var(--glow,#333) 0%,#121215 70%);display:grid;place-items:center}
.ph svg{width:86%;height:86%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6))}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.3px}
.b-orig{background:var(--grn);color:#002b14}.b-rep{background:#3a3a44;color:#e2e2ea}
.b-ord{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.6);font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:8px}
.info{padding:10px 11px 12px}
.info b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;min-height:34px}
.info .sz{font-size:12px;color:var(--mut);margin-top:4px}
.info .pr{margin-top:6px;font-weight:900;font-size:16px}
.info .pr i{font-style:normal;color:var(--mut);font-weight:600;font-size:12px;margin-left:5px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px 0;border-radius:10px;font-weight:700;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.bar{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{border-color:var(--acc);color:var(--acc)}
.count{font-size:13px;color:var(--mut);margin-bottom:10px}
.empty{text-align:center;color:var(--mut);padding:50px 20px;font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--txt);font-size:17px;margin-bottom:6px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#141417;border-radius:22px 22px 0 0;z-index:51;max-height:82vh;overflow-y:auto;padding:8px 16px 100px;transform:translateY(100%);transition:transform .25s}
.sheet.open{transform:none}.sheet-bg.open{display:block}
.grab{width:40px;height:5px;border-radius:3px;background:#3a3a44;margin:6px auto 12px}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:6px}
.fgroup{margin-top:16px}
.fgroup p{font-size:13px;color:var(--mut);font-weight:600;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.price{display:flex;gap:8px}
.price input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:0}
.sheet-foot{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;padding:12px 16px 18px;background:#141417;border-top:1px solid var(--line);display:flex;gap:10px;z-index:52;display:none}
.sheet-foot.open{display:flex}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:800;font-size:15px;text-align:center;display:block;text-decoration:none}
.btn-y{background:var(--acc);color:#fff}.btn-g{background:var(--card2);border:1px solid var(--line)}
/* product */
.gal{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:1;background:radial-gradient(circle at 50% 55%,var(--glow,#333) 0%,#101013 72%);display:grid;place-items:center;margin-bottom:16px}
.gal svg{width:88%;height:88%;filter:drop-shadow(0 18px 22px rgba(0,0,0,.65))}.slides{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.slides::-webkit-scrollbar{display:none}.slides img{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px}.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4)}.dots i.on{background:#fff}.cnt{position:absolute;bottom:10px;right:12px;background:rgba(0,0,0,.6);font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px}
.pt{font-size:23px;font-weight:900;letter-spacing:-.6px;line-height:1.15}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{font-size:12px;font-weight:700;padding:5px 10px;border-radius:9px;background:var(--card2);border:1px solid var(--line)}
.pp{display:flex;align-items:baseline;gap:10px;margin:6px 0 4px}
.pp b{font-size:30px;font-weight:900}.pp span{color:var(--mut);font-size:16px;font-weight:700}
.note{font-size:12.5px;color:var(--mut)}
.box{background:var(--card);border:1px solid #1d1d22;border-radius:16px;padding:14px;margin-top:14px;font-size:14px;line-height:1.5}
.box h4{font-size:15px;margin-bottom:6px}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222228;font-size:14px}
.row:last-child{border:0}.row span{color:var(--mut)}
.fixed{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;padding:12px 16px 18px;background:linear-gradient(180deg,rgba(11,11,13,0),#0b0b0d 30%);z-index:30}
.icons{margin-left:auto;display:flex;gap:8px}
.ic{position:relative;width:38px;height:38px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:17px}
.ic em{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acc);color:#fff;font-style:normal;font-size:11px;font-weight:900;display:grid;place-items:center}
.heart{position:absolute;top:6px;right:6px;z-index:2;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;font-size:16px;line-height:1}
.fixed>.btn{width:100%}.fixed .row3{display:flex;gap:8px}.fixed .row3 .sq{flex:none;width:52px;font-size:20px;padding:12px 0}
.szpick{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}.szpick p{width:100%;font-size:13px;color:var(--mut);font-weight:600}
.cl{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid #1d1d22;border-radius:16px;padding:10px;margin-bottom:10px}
.cl .im{position:relative;flex:none;width:76px;height:76px;border-radius:12px;overflow:hidden;background:#121215}.cl .im img{width:100%;height:100%;object-fit:cover}.cl .im svg{width:100%;height:100%}
.cl .tx{flex:1;min-width:0;text-align:left}.cl .tx b{display:block;font-size:14px;line-height:1.25}.cl .tx span{display:block;font-size:12px;color:var(--mut);margin-top:3px}.cl .tx i{display:block;font-style:normal;font-weight:900;margin-top:5px}
.cl .rm{flex:none;width:34px;height:34px;border-radius:10px;background:var(--card2);color:var(--mut);font-size:15px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 4px;font-size:15px;color:var(--mut);font-weight:700}.total b{color:var(--txt);font-size:24px;font-weight:900}
.toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%) translateY(20px);background:#26262c;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}.toast.on{opacity:1;transform:translateX(-50%)}
.form .lb{font-size:13px;color:var(--mut);font-weight:700;margin:12px 0 7px}.form .lb:first-child{margin-top:0}
.form .opts{display:flex;flex-wrap:wrap;gap:8px}
.form input,.form textarea,.fitin input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--txt);font:inherit;font-size:15px;outline:none}
.form input:focus,.form textarea:focus,.fitin input:focus{border-color:var(--acc)}.form input.err{border-color:#ff4d4d}
.form textarea{min-height:64px;resize:vertical}
.fitin{display:flex;gap:8px;margin:8px 0 4px}.fitin .btn{flex:none;padding:12px 14px}
.myfit{background:var(--card2);border-radius:12px;padding:10px 12px;margin:6px 0 10px;font-size:14px}.myfit b{font-size:16px}.myfit a{color:var(--acc);margin-left:6px;font-size:13px}
.ok{color:var(--grn)}.warn{color:#ffb020}
.info .mine{display:inline-block;margin-top:5px;font-size:11px;font-weight:800;color:var(--grn)}
.faqbtn{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;background:var(--card);border:1px solid #1d1d22;border-radius:16px;padding:14px;text-align:left;font-size:14px}.faqbtn b{display:block;font-size:15px}.faqbtn span{color:var(--mut);font-size:12.5px}.faqbtn i{font-style:normal;font-size:24px}
.faq details{background:var(--card);border:1px solid #1d1d22;border-radius:14px;margin-bottom:8px;padding:0 14px}
.faq summary{list-style:none;cursor:pointer;padding:14px 0;font-weight:800;font-size:15px;display:flex;justify-content:space-between;gap:10px}.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:'+';color:var(--acc);font-size:20px;line-height:1}.faq details[open] summary:after{content:'–'}
.faq details div{padding:0 0 14px;color:#d4d4dc;font-size:14px;line-height:1.55}
.info .vw{float:right;margin-left:6px;color:var(--mut);font-weight:700}
.info .hot{display:block;margin-top:5px;font-size:11px;font-weight:800;color:#ff8a3d}
.fomo{display:flex;flex-direction:column;gap:6px;margin:2px 0 12px}.fomo span{align-self:flex-start;background:rgba(255,138,61,.12);color:#ffb27a;border:1px solid rgba(255,138,61,.3);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700}
.hidden{display:none!important}
.fit{background:#0f2a1c;border:1px solid #1f5a3a;border-radius:12px;padding:12px;margin-bottom:10px}.fit>b{display:block;margin-bottom:6px}.fitrow{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}.fitrow span{color:var(--mut)}.fitrec{margin-top:8px;font-size:13.5px;color:#cfe9d8}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal img{max-width:100%;max-height:85vh;border-radius:14px}.modal button{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;background:#222;font-size:20px}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <button class="back hidden" id="back" aria-label="Назад">←</button>
    <img class="logo" id="logo" src="img/logo.jpg" alt="FFS">
    <div><b id="ttl">FootballFitStore</b><span id="sub">Джерси · Бутсы · Мячи</span></div>
    <div class="icons"><button class="ic" id="favBtn" aria-label="Избранное">🤍<em id="favN" class="hidden"></em></button><button class="ic" id="cartBtn" aria-label="Корзина">🛒<em id="cartN" class="hidden"></em></button></div>
  </div>
  <div class="search"><span>🔍</span><input id="q" placeholder="Клуб, игрок, бренд…" autocomplete="off"></div>
</div>
<main class="wrap" id="view"></main>
<div class="toast" id="toast"></div>

<div class="modal" id="chart"><img src="img/size_chart.jpg" alt="Таблица размеров"><button id="chartX">✕</button></div>
<div class="sheet-bg" id="sbg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><h3>Фильтры</h3><div id="fbody"></div></div>
<div class="sheet-foot" id="sfoot"><button class="btn btn-g" id="freset">Сбросить</button><button class="btn btn-y" id="fapply">Показать</button></div>

<script>
const MANAGER='ffs_mngr';
const RUB=28.8184; // курс Сбербанка: 100 BYN = 2881,84 ₽ (1 нояб. 2026). Цена в ₽ считается, если не указана вручную
const CATS=[
 {id:'jersey',name:'Джерси',img:'img/cat_jersey.jpg',wide:true},
 {id:'boots',name:'Бутсы',img:'img/cat_boots.jpg'},
 {id:'futsal',name:'Футзалки',img:'img/cat_futsal.jpg'},
 {id:'tf',name:'Сороконожки',img:'img/cat_tf.jpg'},
 {id:'ball',name:'Мячи',img:'img/cat_ball.jpg'}
];
const FILTERS={
 jersey:[['club','Клуб / сборная'],['league','Лига'],['era','Тип'],['named','Фамилия'],['sleeve','Рукав'],['version','Версия'],['size','Размер'],['stock','Наличие']],
 boots:[['brand','Бренд'],['model','Модель'],['size','Размер'],['surface','Покрытие'],['state','Состояние'],['stock','Наличие']],
 futsal:[['brand','Бренд'],['model','Модель'],['size','Размер'],['state','Состояние'],['stock','Наличие']],
 tf:[['brand','Бренд'],['model','Модель'],['size','Размер'],['state','Состояние'],['stock','Наличие']],
 ball:[['brand','Бренд'],['model','Модель'],['bsize','Размер мяча'],['type','Тип'],['stock','Наличие']]
};
const SIZE_ORDER=['XS','S','M','L','XL','2XL','3XL'];
// ======= ДЕМО-ТОВАРЫ (потом будут из Google Таблицы) =======
const J=(c1,c2,c3)=>({shirt:[c1,c2,c3||'#ffffff']});
let P=[];
P.forEach((p,i)=>p.added=P.length-i);
// Google Таблица: вставь сюда ссылку «Опубликовать в интернете → CSV». Пусто = демо-товары.
const SHEET_CSV='';
// ======================================================
const tg=window.Telegram&&Telegram.WebApp; if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#0b0b0d');tg.setBackgroundColor('#0b0b0d')}catch(e){}}
const $=s=>document.querySelector(s), view=$('#view');
let st={page:'home',cat:null,auth:'all',f:{},pmin:'',pmax:'',sort:'new',q:'',prod:null};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rub=p=>p.rub||Math.ceil((p.byn+(p.stock==='Под заказ'||p.ship==='warehouse'?0:20))*RUB/10)*10; // под заказ и со склада: доставка уже в цене; иначе +20 BYN для РФ. Округление вверх до 10 ₽
const priceTxt=p=>p.byn?`${rub(p).toLocaleString('ru')} ₽<i>/ ${p.byn} BYN</i>`:`Цена по запросу`;
function shirt(p){const [a,b,c]=p.shirt;return `<svg viewBox="0 0 200 200"><path d="M62 28 L84 20 Q100 34 116 20 L138 28 L176 54 L160 86 L142 76 L142 178 L58 178 L58 76 L40 86 L24 54 Z" fill="${a}" stroke="rgba(0,0,0,.25)" stroke-width="2"/><path d="M84 20 Q100 34 116 20 L112 18 Q100 28 88 18Z" fill="${c}"/><path d="M58 150 H142 V160 H58Z" fill="${b}" opacity=".9"/><path d="M24 54 L40 86 L50 81 L34 49Z" fill="${b}"/><path d="M176 54 L160 86 L150 81 L166 49Z" fill="${b}"/></svg>`}
const pic=p=>p.photos&&p.photos.length?`<img src="${p.photos[0]}" alt="${esc(p.title)}" loading="lazy">`:shirt(p);
const gallery=p=>p.photos&&p.photos.length?`<div class="slides" id="sl">${p.photos.map(u=>`<img src="${u}" alt="">`).join('')}</div>${p.photos.length>1?`<div class="dots">${p.photos.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}`:shirt(p);
const badge=p=>`<span class="badge ${p.auth==='original'?'b-orig':'b-rep'}">${p.auth==='original'?'Оригинал':'Реплика'}</span>`+(p.stock&&p.stock!=='В наличии'?`<span class="b-ord">${esc(p.stock)}</span>`:'');
const card=p=>`<button class="item" data-id="${p.id}"><div class="ph" style="--glow:${p.glow||'#333'}">${pic(p)}<span class="heart" data-fav="${p.id}">${isFav(p.id)?'❤️':'🤍'}</span></div><div class="info"><b>${esc(p.title)}</b><div class="sz">${(STATS[p.id]?.view||0)>=FOMO.view?`<span class="vw">👁 ${STATS[p.id].view}</span>`:''}Размер: ${esc(p.size)}${p.auth==='original'?' · <span style="color:var(--grn);font-weight:700">Оригинал</span>':''}${p.stock&&p.stock!=='В наличии'?' · '+esc(p.stock):''}</div>${fitDiff(p)===0?'<span class="mine">✅ твой размер</span>':''}${(STATS[p.id]?.cart||0)>=FOMO.cart?`<span class="hot">🔥 В корзине у ${uppl(STATS[p.id].cart)}</span>`:''}<div class="pr">${priceTxt(p)}</div></div></button>`;
const CHART={fan:[['S','160–170','50–60',50],['M','170–176','60–68',52],['L','176–182','68–78',54],['XL','182–188','78–88',56],['2XL','188–195','88–100',59]],
 pl:[['S','160–170','50–57',46],['M','170–176','57–65',48],['L','176–182','65–74',50],['XL','182–188','74–84',52],['2XL','188–195','84–94',54]]};
function fit(p){if(!p.w)return'';const t=CHART[p.version==='Игровая'?'pl':'fan'];let best=t[0];for(const r of t)if(Math.abs(r[3]-p.w)<Math.abs(best[3]-p.w))best=r;
 return `<div class="fit"><b>📏 Замеры этой джерси</b><div class="fitrow"><span>Ширина</span><b>${p.w} см</b></div>${p.l?`<div class="fitrow"><span>Длина</span><b>${p.l} см</b></div>`:''}<div class="fitrec">По замерам подойдёт примерно на <b>рост ${best[1]} см</b>, <b>вес ${best[2]} кг</b></div></div>`}

  r.forEach(x=>track('order',x.p));const url=`https://t.me/${MANAGER}?text=${encodeURIComponent(msg)}`;

 ['Можно вернуть или обменять?','Возврата и обмена нет, поэтому перед заказом сверь размер. Если не уверен — спроси менеджера, он пришлёт замеры и поможет выбрать.'],
 ['Нет нужного клуба или размера?','Напиши @'+MANAGER+' — найдём и привезём под заказ.'],
 ['Где посмотреть отзывы?','Последние отправки и отзывы покупателей — в канале <a href="https://t.me/sksbvwsis" style="color:var(--acc)">t.me/sksbvwsis</a>.']
];

function toggleFav(p){if(isFav(p.id)){FAV=FAV.filter(x=>x!==p.id);srv('unfav',p.id);toast('Убрано из избранного')}else{FAV.unshift(p.id);track('fav',p);toast('❤️ Добавлено в избранное')}save()}

function favView(){const r=FAV.map(id=>P.find(p=>p.id===id)).filter(Boolean);
 view.innerHTML=r.length?`<div class="count">${r.length} шт.</div><div class="grid">${r.map(card).join('')}</div>`:`<div class="empty"><b>Пока пусто</b>Нажми 🤍 на товаре, чтобы сохранить его сюда</div>`}

 if(!r.length){view.innerHTML=`<div class="empty"><b>Корзина пуста</b>Добавь товары кнопкой «В корзину»</div>`;return}
 const byn=r.reduce((a,x)=>a+(x.p.byn||0),0),rb=r.reduce((a,x)=>a+(x.p.byn?rub(x.p):0),0),ask=r.some(x=>!x.p.byn);
 const msg='Здравствуйте! Хочу заказать:\n'+r.map((x,i)=>`${i+1}. ${x.p.title}, размер ${x.c.size}${x.p.byn?`, ${x.p.byn} BYN / ${rub(x.p)} ₽`:''}`).join('\n')+(byn?`\nИтого: ${byn} BYN / ${rb.toLocaleString('ru')} ₽`:'');
 view.innerHTML=r.map(({c,p})=>`<div class="cl"><button class="im" data-id="${p.id}">${p.photos&&p.photos.length?`<img src="${p.photos[0]}" alt="">`:shirt(p)}</button><div class="tx"><b>${esc(p.title)}</b><span>Размер: ${esc(c.size)}${p.auth==='original'?' · Оригинал':''}</span><i>${p.byn?`${rub(p).toLocaleString('ru')} ₽ / ${p.byn} BYN`:'Цена по запросу'}</i></div><button class="rm" data-rm="${p.id}">✕</button></div>`).join('')+
 `<div class="box"><div class="total"><span>Итого, ${r.length} шт.</span><b>${byn?`${rb.toLocaleString('ru')} ₽`:'—'}</b></div>${byn?`<div class="total" style="margin-top:0"><span></span><span>${byn} BYN${ask?' + товары с ценой по запросу':''}</span></div>`:''}<div style="font-size:13px;color:var(--mut);margin-top:6px">Дальше укажешь страну, город и контакты — менеджеру уйдёт готовый заказ одним сообщением.</div></div>
 <div style="height:90px"></div><div class="fixed"><button class="btn btn-y" id="checkout">Оформить заказ · ${r.length} шт.</button></div>`;
 $('#checkout').onclick=()=>go('checkout',{buy:null})}
// статистика (Яндекс Метрика): просмотры товаров и нажатия «Заказать»
const YM=113965941; // номер счётчика Метрики
if(YM){(function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};m[i].l=1*new Date();k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})(window,document,'script','https://mc.yandex.ru/metrika/tag.js','ym');ym(YM,'init',{clickmap:true,trackLinks:true,accurateTrackBounce:true})}
// ---- счётчики для покупателей (сервер бота) ----
const API='https://ffs-bot.vovapronin87.workers.dev';
const FOMO={view:1,cart:1,fav:1}; // показывать, начиная с этих чисел
let STATS={};
function srv(kind,pid){try{const initData=tg&&tg.initData;if(!initData||!pid)return;fetch(API+'/track',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({kind,pid,initData}),keepalive:true}).catch(()=>{})}catch(e){}}
async function loadStats(){try{const r=await fetch(API+'/stats');if(r.ok){STATS=await r.json();if(st.page==='cat'||st.page==='prod'||st.page==='fav')render()}}catch(e){}}
const plur=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c};
const ppl=n=>n+' '+plur(n,'человек','человека','человек');
const uppl=n=>n+' '+plur(n,'человека','человек','человек'); // «у 1 человека», «у 3 человек»
function fomoLines(p){const s=STATS[p.id]||{},o=[];
 if((s.cart||0)>=FOMO.cart)o.push(`🛒 В корзине у ${uppl(s.cart)}`);
 if((s.view||0)>=FOMO.view)o.push(`👁 ${ppl(s.view)} ${plur(s.view,'смотрел','смотрели','смотрели')} этот товар`);
 if((s.fav||0)>=FOMO.fav)o.push(`❤️ ${ppl(s.fav)} ${plur(s.fav,'добавил','добавили','добавили')} в избранное`);
 return o}
function track(kind,p){if(p&&(kind==='view'||kind==='fav'||kind==='cart'))srv(kind,p.id);try{if(!YM||!window.ym||!p)return;const lbl={view:'👁 Просмотр',cart:'🛒 В корзину',fav:'❤️ В избранное',order:'✅ Заказать'}[kind]+' — '+p.title+' ('+p.size+')';ym(YM,'hit',location.origin+location.pathname+'#'+kind+'-'+p.id,{title:lbl});if(kind==='order')ym(YM,'reachGoal','order',{product:p.title})}catch(e){}}
const HIST=[];
function go(page,extra={}){if(page===st.page&&page!=='prod'&&page!=='cat')return;HIST.push({page:st.page,cat:st.cat,prod:st.prod,buy:st.buy});st.size=null;if(page!=='checkout')st.buy=null;if(page==='prod')track('view',P.find(x=>x.id===extra.prod));if(page!=='prod')st.prod=null;Object.assign(st,{page},extra);history.pushState(null,'');render()}
// фильтры
function openF(){const base=P.filter(p=>p.cat===st.cat&&(st.auth==='all'||p.auth===st.auth));
 $('#fbody').innerHTML=FILTERS[st.cat].map(([k,t])=>{const v=vals(base,k);if(!v.length)return'';return`<div class="fgroup"><p>${t}</p><div class="opts">${v.map(x=>`<button class="chip ${(st.f[k]||[]).includes(x)?'on':''}" data-fk="${k}" data-fv="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`}).join('')+
 `<div class="fgroup"><p>Цена, BYN</p><div class="price"><input inputmode="numeric" id="pmin" placeholder="от" value="${st.pmin}"><input inputmode="numeric" id="pmax" placeholder="до" value="${st.pmax}"></div></div>`;
 ['#sheet','#sbg','#sfoot'].forEach(s=>$(s).classList.add('open'))}
function closeF(){['#sheet','#sbg','#sfoot'].forEach(s=>$(s).classList.remove('open'))}
$('#fbody').onclick=e=>{const b=e.target.closest('[data-fk]');if(!b)return;b.classList.toggle('on')};
$('#fapply').onclick=()=>{st.f={};document.querySelectorAll('#fbody .chip.on').forEach(b=>{(st.f[b.dataset.fk]??=[]).push(b.dataset.fv)});st.pmin=$('#pmin').value;st.pmax=$('#pmax').value;closeF();render()};
$('#freset').onclick=()=>{st.f={};st.pmin=st.pmax='';closeF();render()};
$('#sbg').onclick=closeF;$('#chart').onclick=()=>$('#chart').classList.remove('open');
view.onclick=e=>{const hf=e.target.closest('[data-fav]');if(hf){e.stopPropagation();const p=P.find(x=>x.id===+hf.dataset.fav);if(p){toggleFav(p);if(st.page==='fav')render();else hf.textContent=isFav(p.id)?'❤️':'🤍'}return}
 const rm=e.target.closest('[data-rm]');if(rm){CART=CART.filter(c=>c.id!==+rm.dataset.rm);srv('uncart',+rm.dataset.rm);save();render();return}
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.cat){go('cat',{cat:t.dataset.cat,auth:'all',f:{},pmin:'',pmax:'',sort:'new'})}
 else if(t.dataset.id){go('prod',{prod:+t.dataset.id})}
 else if(t.dataset.auth){st.auth=t.dataset.auth;st.f={};render()}
 else if(t.dataset.sort){st.sort=st.sort===t.dataset.sort?'new':t.dataset.sort;render()}
 else if(t.id==='fopen')openF()
 else if(t.id==='mine'){st.mine=!st.mine;render()}
 else if(t.dataset.go){go(t.dataset.go)}};
const back=()=>{closeF();st.size=null;const h=HIST.pop();if(h)Object.assign(st,h);else st.page='home';render()};
$('#back').onclick=back;$('#favBtn').onclick=()=>go('fav');$('#cartBtn').onclick=()=>go('cart'); if(tg)tg.BackButton.onClick(back);

// ---- загрузка товаров из Google Таблицы ----
function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'){r.push(f);rows.push(r);r=[];f=''}else if(c!='\r')f+=c}if(f||r.length){r.push(f);rows.push(r)}return rows}
const CATMAP={'джерси':'jersey','бутсы':'boots','футзалки':'futsal','сороконожки':'tf','мячи':'ball','мяч':'ball'};
const COLS={'категория':'cat','название':'title','оригинал/реплика':'auth','размер':'size','цена byn':'byn','цена ₽':'rub','цена kzt':'kzt','наличие':'stock','доставка':'ship','фото':'photos','клуб':'club','лига':'league','тип':'era','фамилия':'named','рукав':'sleeve','версия':'version','бренд':'brand','модель':'model','покрытие':'surface','состояние':'state','ширина':'w','длина':'l','размер мяча':'bsize','тип мяча':'type','показывать':'show'};
const PHOTO_BASE='img/';
async function loadSheet(){try{const t=await (await fetch(SHEET_CSV,{cache:'no-store'})).text();const rows=parseCSV(t);const head=rows.shift().map(h=>COLS[h.trim().toLowerCase()]||h);
 P=rows.map((r,i)=>{const o={};head.forEach((h,j)=>o[h]=(r[j]||'').trim());o.id=i+1;o.added=i+1;o.cat=CATMAP[o.cat.toLowerCase()]||o.cat;o.auth=/ориг/i.test(o.auth)?'original':'replica';o.byn=+o.byn||0;o.w=parseFloat(String(o.w).replace(',','.'))||0;o.l=parseFloat(String(o.l).replace(',','.'))||0;o.rub=+o.rub||0;o.kzt=+o.kzt||0;o.ship=/склад/i.test(o.ship)?'warehouse':'';o.photos=o.photos?o.photos.split(/[\s,;]+/).filter(Boolean).map(u=>/^https?:/.test(u)?u:PHOTO_BASE+u):[];if(!o.photos.length)o.shirt=['#3a3a44','#26262c','#fff'];return o}).filter(o=>o.title&&!/^нет$/i.test(o.show||''));
}catch(e){console.error(e)}render()}
async function loadProducts(){try{const r=await fetch('products.json?t='+Date.now(),{cache:'no-store'});P=await r.json();P.forEach((p,i)=>{if(p.added==null)p.added=P.length-i})}catch(e){console.error(e)}cleanSaved();render()}
loadSaved();loadStats();if(SHEET_CSV)loadSheet();else{render();loadProducts();}
